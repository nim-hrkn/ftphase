calculations:
- mode: melting_temperature
  temperature: 1540.0
  pressure: 50000.0
  element: Cu
  mass: 63.546
  lattice: FCC
  lattice_constant: 3.615
  repeat: [5, 5, 5]
  pair_style: eam/alloy
  pair_coeff: '* * ../potentials/Cu01.eam.alloy Cu'
  n_equilibration_steps: 10000
  n_switching_steps: 30000
  n_iterations: 1
  queue:
    queuename: debug
    memory: 8GB
    walltime: '48:00:00'
    commands:
    - source /home/kino/miniforge3/etc/profile.d/conda.sh && conda activate /home/kino/kino/Claude/Projects/PhaseDiagram/env/calphy
    scheduler: slurm
    cores: 4
