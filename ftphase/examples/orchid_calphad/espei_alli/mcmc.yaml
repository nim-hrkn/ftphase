# ESPEI step 2: Bayesian (emcee) fit of every VV#### symbol in alli-start.tdb to the ORCHID datasets
system:
  phase_models: phases.json
  datasets: datasets
mcmc:
  iterations: 400
  save_interval: 10
  chains_per_parameter: 2
  chain_std_deviation: 0.2
  input_db: alli-start.tdb
  scheduler: dask
  cores: 8
  deterministic: true
  # fitted: compound enthalpies and T-terms (VV0000/13, VV0001/14, VV0004/12), liquid L0 a,b and L1 (VV0006-8),
  # fcc L0 a,b (VV0009-10), B32 symmetric L (VV0011). Not fitted: the SGTE lattice stability of B32 AL:AL (VV0002/3)
  # and the unused VV0005.
  symbols: [VV0000, VV0001, VV0004, VV0006, VV0007, VV0008, VV0009, VV0010, VV0011, VV0012, VV0013, VV0014]
output:
  output_db: alli-mcmc.tdb
  tracefile: trace.npy
  probfile: lnprob.npy
  verbosity: 2
  logfile: mcmc.log
